<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>果蠅腦區學習</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* 版面：頂列（模式／分區／搜尋）＋ 左 3D 視窗 ＋ 右側欄（清單／卡片）＋ 底列（視角／顯示控制）；手機寬度時側欄移到 3D 下方 */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --fg: #1d2129; --muted: #5d6572; --line: #d9dde3;
  --accent: #1e4b7a; --accent-fg: #ffffff; --hover: #eef2f7; --canvas: #e9ecf0; --label: #111; --label-bg: rgba(255,255,255,.82);
  --sel: #c8102e;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181d; --panel: #1e2229; --fg: #e8eaee; --muted: #9aa3b0; --line: #343a44;
  --accent: #6fa3d8; --accent-fg: #0f1420; --hover: #262c36; --canvas: #0f1216; --label: #f2f2f2; --label-bg: rgba(20,22,26,.78);
  --sel: #ff5c6c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15181d; --panel: #1e2229; --fg: #e8eaee; --muted: #9aa3b0; --line: #343a44;
  --accent: #6fa3d8; --accent-fg: #0f1420; --hover: #262c36; --canvas: #0f1216; --label: #f2f2f2; --label-bg: rgba(20,22,26,.78);
  --sel: #ff5c6c; color-scheme: dark; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; display: flex; flex-direction: column; min-height: 100%; }
button, select, input { font: inherit; color: inherit; }
.top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 700; letter-spacing: .02em; }
.modes { display: flex; gap: 4px; }
.modes button { border: 1px solid var(--line); background: transparent; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.modes button:disabled { opacity: .45; cursor: not-allowed; }
label.f { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
select, input[type=search] { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 4px 8px; }
input[type=search] { width: 140px; }
.main { flex: 1; display: flex; min-height: 0; }
.view { flex: 1; position: relative; min-width: 0; background: var(--canvas); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.view.dragging, .view.dragging .lab { cursor: grabbing; }
.view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lab { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-ui); font-weight: 600; font-size: 12px; color: var(--label);
  background: var(--label-bg); padding: 1px 4px; border-radius: 3px; white-space: nowrap; pointer-events: auto; cursor: pointer; line-height: 1.3; }
.lab.dim { opacity: .35; }
.lab.b { border: 1px dashed var(--muted); font-weight: 500; }
.lab.cp { outline: 2px solid #2b6cb0; }
.divider { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); pointer-events: none; }
.cap { position: absolute; top: 28px; font-size: 12px; font-weight: 600; color: var(--muted); pointer-events: none; }
.capA { left: 12px; } .capB { left: calc(50% + 12px); }
.tb { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 3px 9px; cursor: pointer; font-size: 13px; }
.tb:hover { background: var(--hover); }
dialog#abbrDlg { border: 1px solid var(--line); border-radius: 8px; padding: 0; width: min(760px, 94vw); max-height: 86vh; background: var(--panel); color: var(--fg); }
dialog#abbrDlg::backdrop { background: rgba(0,0,0,.35); }
.dlg { display: flex; flex-direction: column; max-height: 86vh; }
.dlgTop { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dlgTop h2 { font-size: 16px; margin: 0; flex: 1; }
.dlgBody { overflow: auto; padding: 8px 16px; }
.dlgFoot { padding: 8px 16px 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
#abbrTbl { border-collapse: collapse; width: 100%; font-size: 13px; }
#abbrTbl th, #abbrTbl td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
#abbrTbl th:first-child, #abbrTbl td:first-child { font-family: var(--font-ui); white-space: nowrap; }
.card abbr { text-decoration: underline dotted; text-underline-offset: 2px; cursor: help; }
.legend { position: absolute; left: 12px; top: 28px; font-size: 12px; color: var(--muted); pointer-events: none; display: flex; gap: 14px; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; background: #7fb3d5; }
.legend .sw.wire { background: repeating-linear-gradient(45deg, #30363d 0 2px, transparent 2px 5px); border: 1px solid #30363d; }
.pins { padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.pins .ph { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; } .pins .ph b { flex: 1; }
.pins .pin { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; margin: 2px 4px 2px 0; font-family: var(--font-ui); font-size: 12px; }
.pins .pin .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.pins .pin button { border: 0; background: transparent; cursor: pointer; padding: 0 2px; color: var(--muted); font-size: 13px; }
.pins .ov2 { margin-top: 6px; color: var(--fg); }
.pins .ov2 .muted { color: var(--muted); font-size: 12px; }
.card .pinBtn { margin-left: 8px; }
.ln { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.ln h3 { margin: 0 0 6px; }
.ln .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.ln table { border-collapse: collapse; font-size: 12px; margin-top: 4px; } .ln th, .ln td { padding: 2px 8px 2px 0; border-bottom: 1px solid var(--line); text-align: right; } .ln th:first-child, .ln td:first-child { text-align: left; }
.ln td.cur, .ln th.cur { background: var(--hover); }
.ln .muted, .card .muted { color: var(--muted); font-size: 12px; }
.nc .bar { display: inline-block; height: 8px; background: var(--accent); border-radius: 2px; vertical-align: middle; }
.nc table { border-collapse: collapse; font-size: 12px; width: 100%; } .nc td { padding: 2px 6px 2px 0; border-bottom: 1px solid var(--line); } .nc td.r { text-align: right; white-space: nowrap; }
.nc tr.rg { cursor: pointer; } .nc tr.rg:hover { background: var(--hover); }
.lab.nl { border: 1px solid var(--fg); font-weight: 500; }
.syn .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; margin-right: 3px; }
.syn tr.gh td { background: var(--hover); padding-top: 5px; border-top: 1px solid var(--line); } .syn tr.gh { cursor: pointer; } .syn tr.gh:hover b { text-decoration: underline; } .syn tr.gh.cur td { border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); } .syn tr.gh.cur td:first-child { border-left: 2px solid var(--accent); } .syn tr.gh.cur td:last-child { border-right: 2px solid var(--accent); } .syn tr.gh .tb { margin-left: 4px; } .syn tr.pt { cursor: pointer; } .syn tr.pt:hover { background: var(--hover); } .syn tr.pt.cur { outline: 2px solid var(--accent); } .syn tr.more { display: none; } .syn table.all tr.more { display: table-row; }
.syn td .tb { padding: 1px 5px; font-size: 12px; } .syn td:last-child { white-space: nowrap; } .syn td:nth-child(2) { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; word-break: break-all; } .syn h4 { font-size: 13px; }
.syn .cr { margin: 2px 0 4px; font-size: 12px; } .syn .crtag { color: #fff; border-radius: 3px; padding: 0 6px; font-weight: 600; font-size: 11px; } .syn .nt { white-space: nowrap; font-weight: 600; font-size: 12px; } .syn .ntbar { display: flex; height: 8px; border-radius: 3px; overflow: hidden; margin: 4px 0 2px; background: var(--line); } .syn .ntbar i { display: block; height: 100%; }
.chip.done::after { content: "✓"; color: #1f9d55; font-weight: 700; margin-left: 2px; }
.quiz h2 { font-size: 18px; margin: 0 0 6px; }
.quiz .q { font-size: 15px; margin: 8px 0; }
.quiz .q b { font-family: var(--font-ui); font-size: 22px; }
.quiz .choices { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.quiz .choices button { font-family: var(--font-ui); font-size: 14px; padding: 6px 12px; }
.quiz .ok { color: #1f9d55; font-weight: 700; } .quiz .ng { color: #c8102e; font-weight: 700; }
.quiz .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 6px 0; } .quiz .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.quiz .clock { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; } .quiz .clock .bar { flex: 1; margin: 0; } .quiz .clock.hurry { color: #c8102e; font-weight: 700; } .quiz .clock.hurry .bar i { background: #c8102e; }
.quiz table { border-collapse: collapse; font-size: 12px; } .quiz td, .quiz th { padding: 2px 8px 2px 0; border-bottom: 1px solid var(--line); text-align: left; }
.bm { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); } .bm b { flex: 1; } .bm .muted { font-size: 12px; }
.lhead { font-weight: 700; margin: 6px 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
.card .atl { color: var(--muted); font-size: 12px; }
.card h3 { font-size: 13px; margin: 12px 0 4px; }
.card .cwh { color: var(--muted); font-size: 12px; margin: 6px 0 2px; } .card .cwovl { border-left: 3px solid var(--line); padding-left: 8px; } .card dd.cwovl { margin-left: 0; }
.card .cps { margin: 0; padding-left: 18px; } .card .cps li { margin-bottom: 3px; } .card .muted { color: var(--muted); font-size: 12px; }
.card table.ov { border-collapse: collapse; font-size: 12px; } .card table.ov th, .card table.ov td { border-bottom: 1px solid var(--line); padding: 2px 8px 2px 0; text-align: left; } .card table.ov td:nth-child(n+2) { text-align: right; }
.lab.sel { outline: 2px solid var(--sel); }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
.status { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
.side { width: 330px; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); min-width: 0; }
.list { flex: 1 1 50%; overflow: auto; padding: 8px 10px; border-bottom: 1px solid var(--line); min-height: 120px; }
details { margin-bottom: 4px; }
summary { cursor: pointer; font-weight: 500; padding: 4px 2px; display: flex; align-items: center; gap: 8px; }
summary .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
summary .n { color: var(--muted); font-size: 12px; margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 0 6px 18px; }
.chip { border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; font-family: var(--font-ui); font-size: 12px; cursor: pointer; background: transparent; display: inline-flex; align-items: center; gap: 5px; }
.chip .sw { width: 8px; height: 8px; border-radius: 2px; }
.chip:hover { background: var(--hover); }
.chip.sel { border-color: var(--sel); box-shadow: inset 0 0 0 1px var(--sel); }
.chip.hidden-by-search { display: none; }
.chip.lpu-dim { opacity: .35; }
.bottom .lc::before, .lpc::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 3px; vertical-align: -1px; }
.lpc { display: flex; align-items: baseline; } .lpc::before { flex: none; } .lpc.sub { margin-left: 14px; cursor: pointer; border-radius: 3px; padding: 0 3px; } .lpc.sub:hover { background: var(--hover); } .lpc.sub.cur { outline: 2px solid #d7263d; font-weight: 600; } h2 .subsel { color: #d7263d; font-size: .8em; }
#lpuSels select { max-width: 18vw; }
#lpuLegend { flex-direction: column; gap: 2px; }
.card { flex: 1 1 50%; overflow: auto; padding: 12px 14px; min-height: 160px; }
.card h2 { margin: 0 0 2px; font-family: var(--font-ui); font-size: 26px; letter-spacing: .01em; }
.card .full { color: var(--muted); font-size: 13px; margin-bottom: 10px; } .card dd.trivia { background: var(--hover); border-left: 3px solid #e0a800; padding: 6px 8px; border-radius: 0 4px 4px 0; } .card dd.trivia b { color: #8a6500; } .say { cursor: pointer; font-size: 12px; line-height: 1; } .card .full .say { padding: 0 5px; } .chip .say { opacity: 0.45; margin-left: 1px; } .chip:hover .say, .chip.sel .say { opacity: 1; } .say:hover { filter: brightness(0.8); }
.card dl { display: grid; grid-template-columns: 4.5em 1fr; gap: 4px 10px; margin: 0; }
.card dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
.card dd { margin: 0; min-width: 0; }
.card .todo { color: var(--muted); font-style: italic; }
.card .empty { color: var(--muted); }
.card .ev { display: inline-block; border-radius: 3px; padding: 0 6px; font-size: 12px; border: 1px solid var(--line); }
.bottom { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
.bottom .grp { display: inline-flex; gap: 4px; align-items: center; }
.bottom .grp > span { color: var(--muted); font-size: 12px; margin-right: 2px; }
.bottom button { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 3px 9px; cursor: pointer; }
.bottom button:hover { background: var(--hover); }
.bottom button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
input[type=range] { width: 110px; }
button:focus-visible, .chip:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 760px) {
  .top select { max-width: 62vw; }
  .main { flex-direction: column; }
  .view { min-height: 46vh; }
  .side { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 48vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="top">
  <h1>果蠅腦區學習</h1>
  <div class="modes" role="group" aria-label="模式">
    <button data-mode="single" aria-pressed="true">單套學習</button>
    <button data-mode="overlay" aria-pressed="false" title="兩套同座標系的分區疊在一起（Ito × Chiang）">疊圖比較</button>
    <button data-mode="side" aria-pressed="false" title="任兩套左右並排、鏡頭同步">並排比較</button>
  </div>
  <label class="f">分區 <select id="atlas"></select></label>
  <label class="f" id="atlasBWrap" hidden>對照 <select id="atlasB"></select> <button id="swapBtn" class="tb" title="A、B 互換">⇄</button></label>
  <button id="abbrBtn" class="tb" title="神經元型與縮寫的解釋">縮寫表</button>
  <label class="f" title="把目前的 3D 畫面存成檔案：.glb 可插入 PowerPoint（插入 → 3D 模型），.html 用瀏覽器打開可旋轉、點區看資訊"><select id="snapSel"><option value="">存成 3D 檔…</option><option value="glb">PPT 用 3D 模型（.glb）</option><option value="html">互動網頁（.html，含區資訊）</option></select></label>
  <button id="bmBtn" class="tb" title="把目前畫面存成書籤，之後一鍵回到">書籤</button>
  <label class="f" title="測驗：先隱藏標籤，每次 10 題"><select id="quizSel"><option value="">測驗…</option><option value="point">給名字，在 3D 點出腦區</option><option value="mc">亮一區，四選一</option></select> <select id="quizTime" title="限時：每題倒數，時間到算答錯"><option value="0">不限時</option><option value="10">每題 10 秒</option><option value="20">每題 20 秒</option><option value="30">每題 30 秒</option><option value="60">每題 60 秒</option></select></label>
  <label class="f">搜尋 <input id="q" type="search" placeholder="區名或神經元 id" autocomplete="off"></label>
</div>
<div class="main">
  <div class="view" id="view">
    <div class="labels" id="labels"></div>
    <div class="status" id="status">載入中…</div>
    <div class="divider" id="divider" hidden></div>
    <div class="cap capA" id="capA"></div><div class="cap capB" id="capB"></div>
    <div class="legend" id="legend" hidden></div>
    <div class="legend" id="lpuLegend" hidden></div>
    <div class="hint" id="hint">左鍵旋轉 ｜ 滾輪縮放 ｜ 右鍵或 Shift+左鍵平移 ｜ 點區選取、再點取消 ｜ 雙擊飛到該區</div>
  </div>
  <aside class="side">
    <div class="list" id="list"></div>
    <div class="pins" id="pins" hidden></div>
    <div class="card" id="card"><div class="empty">點 3D 裡的腦區，或點左邊清單的名字。</div></div>
  </aside>
</div>
<div class="bottom">
  <div class="grp"><span>視角</span>
    <button data-view="front">前</button><button data-view="back">背</button><button data-view="left">左</button><button data-view="right">右</button><button data-view="top">上</button><button data-view="bottom">下</button><button id="reset">重設</button>
  </div>
  <div class="grp"><span>透明度</span><input id="alpha" type="range" min="0.1" max="1" step="0.05" value="1"></div>
  <div class="grp" role="group" aria-label="左右"><span>顯示</span>
    <button data-side="all" aria-pressed="true">全部</button><button data-side="L">只看左</button><button data-side="R">只看右</button>
  </div>
  <div class="grp" id="ovlGrp" hidden role="group" aria-label="疊圖"><span>疊圖</span>
    <button data-ovl="both" aria-pressed="true">兩套</button><button data-ovl="A">只看 A</button><button data-ovl="B">只看 B</button>
    <span style="margin-left:8px">B 畫法</span>
    <button data-bstyle="wire" aria-pressed="true" title="B 只畫線框，看得到 A 的實心也看得到 B 的邊界">線框</button><button data-bstyle="mono" title="B 全部同一色、半透明">單色</button><button data-bstyle="tint" title="B 用各區功能色但調淡、半透明">淡色</button>
  </div>
  <div class="grp"><label class="f" title="只顯示釘選的區（與目前選取的區）"><input id="focus" type="checkbox"> 只看釘選</label></div>
  <div class="grp" id="lpuGrp" role="group" aria-label="LPU 分類" hidden><span title="依 A1 系列的判定把腦區分成四類；勾哪幾類就只畫那幾類（其他變淡或不畫）。資料來源與規則跟卡片「局部神經元」同步">LPU</span><span id="lpuSels"></span>
    <label class="f lc" style="--c:#2e9e4f" title="判定為單一 LPU 的區"><input type="checkbox" data-lc="1"> 單一</label><label class="f lc" style="--c:#e58a1f" title="判定為多個候選 LPU 的區（候選 a–b 個）"><input type="checkbox" data-lc="2"> 多個</label><label class="f lc" style="--c:#7b4fbf" title="判定為 hub 的區（LN 太少或沒有自成一單位的熱點）"><input type="checkbox" data-lc="3"> hub</label><label class="f lc" style="--c:#8d949e" title="兩者皆非：LN 夠多但判不出單一或多個，也不像 hub"><input type="checkbox" data-lc="0"> 不可判</label><label class="f lc" style="--c:#d4b106" title="只在切分子區輪次：切分前判為多個候選（LN 密度有好幾團），但切出的子區沒有全部自成 LPU（LN 橫跨各團）→ 讀法 A 整區算一個 LPU"><input type="checkbox" data-lc="4"> 切不開</label>
    <label class="f" title="沒勾到的類別完全不畫（不勾時只是變淡）"><input id="lpuOnly" type="checkbox"> 其他不畫</label></div>
  <div class="grp"><label class="f"><input id="showLabels" type="checkbox" checked> 標籤</label></div>
  <div class="grp"><label class="f"><input id="showBrain" type="checkbox"> 全腦輪廓</label></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const viewEl = $('#view'), labelsEl = $('#labels'), statusEl = $('#status'), listEl = $('#list'), cardEl = $('#card');

// ---------- three.js 基本場景（一個場景、兩個「槽」：槽 0 = 主分區、槽 1 = 對照分區；用 layers 讓並排模式的兩個鏡頭各看各的）
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
viewEl.insertBefore(renderer.domElement, labelsEl);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
function makeCamera() {
  const cam = new THREE.PerspectiveCamera(35, 1, 1, 20000);
  const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(1, 1.2, 1.5); key.layers.enableAll(); cam.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.25); fill.position.set(-1, -0.5, -1); fill.layers.enableAll(); cam.add(fill);
  scene.add(cam);
  return cam;
}
function makeSlot(i) {
  const root = new THREE.Group(); scene.add(root);
  const nroot = new THREE.Group(); root.add(nroot);   // 神經元（與腦區同框）
  return { i, atlas: null, regions: [], meshes: new Map(), labels: new Map(), brain: null, root, nroot, neurons: new Map(), subCache: {}, home: null, target: new THREE.Vector3(), dist: 1200, camera: makeCamera() };
}
const slots = [makeSlot(0), makeSlot(1)];
window.__bd = { slots, get neuro() { return neuro; }, get state() { return state; }, get quiz() { return quiz; }, get speech() { return speech; }, sayText };   // 除錯與自動測試用的把手
const camA = slots[0].camera, camB = slots[1].camera;
camA.layers.set(0); camB.layers.set(1);

// ---------- 自製軌道控制（three r128 的 UMD 版沒附 OrbitControls）；theta/phi/zoom 兩個槽共用，target/dist 各槽自己的
const ctrl = { theta: 0, phi: Math.PI / 2, zoom: 1, up: new THREE.Vector3(0, 1, 0) };
function activeSlots() { return state.mode === 'single' ? [slots[0]] : slots.filter((s) => s.atlas); }
function applyCamera() {
  for (const s of activeSlots()) {
    const cam = s.camera, p = ctrl.phi, t = ctrl.theta;

    cam.position.set(s.target.x + s.dist * Math.sin(p) * Math.sin(t), s.target.y + s.dist * Math.cos(p), s.target.z + s.dist * Math.sin(p) * Math.cos(t));

  }

}
let drag = null;
const el = renderer.domElement;
const labelAt = (e) => { const t = e.target && e.target.closest ? e.target.closest('.lab') : null; return t ? { slot: Number(t.dataset.slot), id: Number(t.dataset.id), sub: t.dataset.sub || null } : null; };
viewEl.addEventListener('contextmenu', (e) => e.preventDefault());
viewEl.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch' && !e.isPrimary) return;

});
viewEl.addEventListener('pointermove', (e) => {

      const k = s.dist * 0.0018;

}
const sameSel = (x) => state.selected && state.selected.slot === x.slot && state.selected.id === x.id && (state.selected.sub || null) === (x.sub || null);   // 子區與母區算不同的選取
viewEl.addEventListener('pointerup', (e) => endDrag(e, true));
viewEl.addEventListener('pointercancel', (e) => endDrag(e, false));
viewEl.addEventListener('lostpointercapture', (e) => endDrag(e, false));
viewEl.addEventListener('dblclick', (e) => { const h = labelAt(e) || rayHit(e); if (h) flyTo(h.slot, h.id); });

const pinchDist = (e) => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);

viewEl.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinch = null; });

// ---------- 資料
const state = { sources: {}, atlases: null, colors: null, crosswalk: [], overlap: {}, abbr: [], mode: 'single', selected: null, hovered: null, side: 'all', alpha: 1, showLabels: true, showBrain: false, ovl: 'both', bStyle: 'wire', pins: [], focus: false, trunkCut: true, declutter: true, spin: false, lpu: { on: new Set() /* 勾選的分類代碼 */, only: false, data: null }, subMeshes: {}, adj: {} };
const PIN_COLORS = ['#c8102e', '#1e6fd9', '#1f9d55', '#e07b00', '#7b3fb0', '#008b8b'];
const INLINE = window.BD_INLINE || null;
const fetchJSON = (u) => INLINE ? (u in INLINE ? Promise.resolve(INLINE[u]) : Promise.reject(new Error(u + ' 不在單檔內'))) : fetch(u).then((r) => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); });
const fetchText = (u) => INLINE ? (u in INLINE ? Promise.resolve(INLINE[u]) : Promise.reject(new Error(u + ' 不在單檔內'))) : fetch(u).then((r) => { if (!r.ok) throw new Error('mesh ' + r.status); return r.text(); });
const atlasById = (id) => state.atlases.atlases.find((a) => a.id === id);
const shortName = (id) => (atlasById(id) || { short: id }).short;

function axisVec(s) { const v = new THREE.Vector3(); const sign = s[0] === '-' ? -1 : 1; v[s[1]] = sign; return v; }

}

}
function parseBundle(buf, manifest) {

  for (const [k, m] of Object.entries(manifest)) {

    const nv = dv.getUint32(0, true), nf = dv.getUint32(4, true);

let loadSeq = 0;
function loadAtlas(slot, id) { const p = loadAtlasInner(slot, id); slot.loading = p; return p; }
async function loadAtlasInner(slot, id) {

  clearSlot(slot);
  const atlas = atlasById(id);
  slot.atlas = atlas;
  const [regions, manifest, buf] = await Promise.all([
    fetchJSON('data/regions_' + id + '.json'), fetchJSON('meshes/' + id + '/manifest.json'),
    fetchText('meshes/' + id + '.b64.txt').then(b64ToBuffer)]);

  const geos = parseBundle(buf, manifest);
  for (const r of regions) {
    const g = geos.get(String(r.id)); if (!g) continue;
    const col = (state.colors.bases[r.base] || { color: '#888888' }).color;
    const mat = new THREE.MeshPhongMaterial({ color: new THREE.Color(col), shininess: 18, transparent: true, opacity: 1, side: THREE.DoubleSide });

    slot.meshes.set(r.id, mesh);

    labelsEl.appendChild(lab);

  }

    slot.brain = new THREE.Mesh(bg, new THREE.MeshPhongMaterial({ color: 0x9aa3b0, transparent: true, opacity: 0.12, depthWrite: false, side: THREE.DoubleSide }));

}
function clearSlot(slot) {

  for (const L of slot.labels.values()) L.el.remove();

  slot.meshes.clear(); slot.labels.clear(); slot.regions = []; slot.atlas = null; slot.home = null;

async function loadOverlap() {

  for (const key of [a + '_' + b, b + '_' + a]) {
    if (key in state.overlap) continue;
    try { state.overlap[key] = await fetchJSON('data/overlap_' + key + '.json'); } catch (e) { state.overlap[key] = null; }

}
function updateStatus() {

  if (state.mode !== 'single' && s1.atlas) t += (state.mode === 'overlay' ? ' ＋ ' : ' ｜ ') + s1.atlas.short + '：' + s1.regions.length + ' 區';
  if (state.mode === 'single' && !s0.atlas.overlay_group) t += '（座標系與 FCWB 不同，只能並排比較）';
  statusEl.textContent = t;
  $('#capA').textContent = state.mode === 'side' ? 'A　' + s0.atlas.short : '';
  $('#capB').textContent = state.mode === 'side' && s1.atlas ? 'B　' + s1.atlas.short : '';
  updateLegend();
}

// ---------- 視角
function fitSlot(slot) {
  const bbox = new THREE.Box3();
  for (const m of slot.meshes.values()) bbox.expandByObject(m);
  bbox.getCenter(slot.target);

}
const VIEWS = { front: [Math.PI / 2, 0], back: [Math.PI / 2, Math.PI], left: [Math.PI / 2, Math.PI / 2], right: [Math.PI / 2, -Math.PI / 2], top: [0.02, 0], bottom: [Math.PI - 0.02, 0] };
function setView(name) { const v = VIEWS[name]; ctrl.phi = v[0]; ctrl.theta = v[1]; applyCamera(); }
function boxOf(slot, ids) {
  const b = new THREE.Box3();

}
function flyTo(si, id) {

  if (state.mode !== 'single' && other.atlas) {

    const ob = boxOf(other, ids);
    if (ob) ob.getCenter(other.target); else if (state.mode === 'overlay') other.target.copy(slot.target);

}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
$('#reset').addEventListener('click', () => { for (const s of slots) if (s.home) s.target.copy(s.home.target); ctrl.zoom = 1; setView('front'); });

// ---------- 點選與滑過
const ray = new THREE.Raycaster();
function hitSlot(e) {

  if (state.mode === 'side') { si = x < 0.5 ? 0 : 1; x = (x - si * 0.5) * 2; cam = slots[si].camera; }
  return { si, cam, ndc: new THREE.Vector2(x * 2 - 1, -(y * 2 - 1)) };
}
function rayHit(e) {
  const h = hitSlot(e);

  const objs = [];

}
function pick(e) {
  const h = rayHit(e), nh = rayHitNeuron(e);
  if (nh && (!h || nh.distance < h.distance)) { selectNeuron(nh.slot, sameNSel(nh) ? null : nh.id); return; }
  if (!h) { select(0, null); if (neuro.selected) selectNeuron(0, null); return; }

}
function hover(e) {
  const h = rayHit(e); const key = h ? h.slot + ':' + h.id + (h.sub ? ':' + h.sub : '') : null;

}
// ---------- 跨套對應
function counterparts(si, base) {
  const A = slots[si].atlas.id, B = slots[1 - si].atlas && slots[1 - si].atlas.id;

    .map((r) => ({ base: r.from_atlas === to ? r.from_base : r.to_base, kind: r.kind, note: r.note, src: r.src || '文獻', via: null }));
  let out = direct(A, base, B);
  if (!out.length && A !== 'ito' && B !== 'ito') {   // Chiang ↔ MaleCNS 沒有直接對應，經 Ito 轉
    for (const m of direct(A, base, 'ito')) for (const n of direct('ito', m.base, B)) out.push({ base: n.base, kind: m.kind + '→' + n.kind, note: [m.note, n.note].filter(Boolean).join('；'), src: (m.src === '疊圖' || n.src === '疊圖') ? '疊圖' : '文獻', via: 'ito ' + m.base });

function overlapRows(si, id) {

  const a = slots[si].atlas.id, b = slots[1 - si].atlas && slots[1 - si].atlas.id; if (!b) return null;
  const d = state.overlap[a + '_' + b] || state.overlap[b + '_' + a]; if (!d) return null;
  const mine = d.a === a;
  const volMe = (mine ? d.vol_a : d.vol_b)[String(id)] || 0; if (!volMe) return [];
  const rows = [];
  for (const [x, y, v] of d.pairs) {
    const me = mine ? x : y, ot = mine ? y : x;

    const volOt = (mine ? d.vol_b : d.vol_a)[String(ot)] || 1;

function pinIndex(si, id, sub) { return state.pins.findIndex((p) => p.slot === si && p.id === id && p.nid == null && (p.sub || null) === (sub || null)); }   // sub：釘選的是切分子區（例如 ME_R.4）
